[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "article-graph"
version = "0.1.0"
description = "Article graph API"
requires-python = ">=3.15,<3.16"
dependencies = [
    "fastapi==0.162.0",
    "neo4j==6.4.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.2",
    "pyjwt==2.15.1",
    "uvicorn==0.54.0",
]

[project.scripts]
article-graph = "article_graph.__main__:main"
init-schema = "article_graph.schema:main"

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pyrefly==1.4.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
    "uv==0.13.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/article_graph"]

[tool.uv]
required-version = "==0.13.6"

[tool.ruff]
target-version = "py315"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src"]
python-version = "3.15"
python-platform = ["win32", "linux"]
preset = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires the isolated Geomotiv test Neo4j (--neo4j)"]
