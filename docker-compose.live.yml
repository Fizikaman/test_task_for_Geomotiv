# P22 fixture only. No application/provider credentials are passed to Docker.
name: geomotiv-p22-live
services:
  neo4j-live:
    image: neo4j:5.26.0-community
    ports:
      - "127.0.0.1:47687:7687"
    environment:
      NEO4J_AUTH: neo4j/geomotiv-p22-synthetic-only
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    tmpfs:
      - /data
      - /logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p geomotiv-p22-synthetic-only 'RETURN 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 20s
